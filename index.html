<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>Misión Voskhod y Venera 7</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Russo+One&display=swap">
<style>
/* Concepto: sala de juegos de una misión espacial soviética. Menú de cartas-tablero con puntaje total y rango; cada juego ocupa la pantalla completa en el celular. */
:root{
  --bg:#0a0d14; --panel:#121826; --panel2:#1a2338; --fg:#ece9e1; --muted:#9aa4b8; --line:#2b3550;
  --red:#ef4136; --gold:#f4b840; --cyan:#62c7e8; --green:#7bd389; --on-red:#ffffff; --space:#0b1020;
  --display:'Russo One','Arial Narrow',Impact,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e7eaf0; --panel:#f7f8fb; --panel2:#dce1ec; --fg:#0e1320; --muted:#48536a; --line:#b6bfd2;
  --red:#c42a1f; --gold:#a96800; --cyan:#0b6f93; --green:#1d7a38; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e7eaf0; --panel:#f7f8fb; --panel2:#dce1ec; --fg:#0e1320; --muted:#48536a; --line:#b6bfd2;
  --red:#c42a1f; --gold:#a96800; --cyan:#0b6f93; --green:#1d7a38; color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin-inline:auto;padding-inline:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:.8rem;padding-block:.55rem}
.brand{font:400 .85rem var(--display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--red);font-weight:400}
.sp{flex:1}
.pts{display:flex;align-items:baseline;gap:.5rem;font-family:var(--mono)}
.pts small{font-size:.7rem;color:var(--muted);letter-spacing:.12em}
.pts b{font:400 1.35rem var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.rank{font:500 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
.btn{background:var(--panel2);border:1.5px solid var(--line);border-radius:4px;padding:.55rem 1rem;font-weight:500;transition:border-color .15s}
.btn:hover{border-color:var(--red)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.sm{padding:.3rem .65rem;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;margin:0;text-wrap:balance}
.kicker{font:500 .75rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin:0 0 .4rem}
.hero{padding-block:28px 12px}
.hero h1{font-size:clamp(2.1rem,7vw,4.4rem);line-height:.98}
.hero h1 i{font-style:normal;color:var(--red)}
.hero p{margin:.9rem 0 0;color:var(--muted);max-width:44ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;padding-block:14px 40px}
.gcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.gcard:hover{transform:translateY(-3px);border-color:var(--red)}
.gcard .art{background:var(--space);display:flex;justify-content:center;padding:14px 0 6px}
.gcard .art svg{width:150px;height:96px}
.gcard .body{padding:.8rem 1rem 1rem;display:flex;flex-direction:column;gap:.25rem}
.gcard h3{font-size:1.1rem}
.gcard p{margin:0;color:var(--muted);font-size:.9rem}
.gcard .best{margin-top:.5rem;font:500 .78rem var(--mono);color:var(--gold);letter-spacing:.06em}
#play{padding-block:14px 50px}
.ptop{display:flex;align-items:center;gap:.8rem;margin-bottom:12px;flex-wrap:wrap}
.ptop h2{font-size:1.2rem;flex:1;min-width:140px}
.pscore{font:400 1.2rem var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem}
.intro{text-align:center;padding:1.4rem 1rem}
.intro h3{font-size:1.5rem;margin-bottom:.4rem}
.intro p{margin:0 auto 1.1rem;color:var(--muted);max-width:40ch}
.big{font:400 clamp(1.3rem,4.5vw,2rem) var(--display);line-height:1.15;text-transform:uppercase;margin:.3rem 0 1rem;text-wrap:balance}
.opt{display:block;width:100%;text-align:left;margin-bottom:.5rem;font-size:1rem}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 25%,var(--panel2))}
.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 28%,var(--panel2))}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:.8rem}
.bar i{display:block;height:100%;width:100%;background:var(--cyan);transition:width .1s linear}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.mono{font-family:var(--mono)}
.stat{font:500 .8rem var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.stat b{color:var(--fg);font-size:1.05rem;font-variant-numeric:tabular-nums}
.res{text-align:center;padding:1.4rem 1rem}
.res .n{font:400 clamp(2.6rem,12vw,4.6rem) var(--display);color:var(--gold);line-height:1}
.res .new{display:inline-block;margin:.5rem 0;background:var(--red);color:var(--on-red);font:500 .75rem var(--mono);letter-spacing:.14em;padding:.2rem .6rem;transform:skewX(-10deg)}
/* rapido */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.8rem}
.duel button{padding:1.1rem .5rem;font:400 1.05rem var(--display);text-transform:uppercase;border-radius:6px;border:2px solid;background:var(--panel2)}
.duel .a{border-color:var(--red)}.duel .b{border-color:var(--gold)}
.duel .a:active{background:var(--red);color:#fff}.duel .b:active{background:var(--gold);color:#000}
.flash{animation:fl .35s}
@keyframes fl{0%{background:color-mix(in srgb,var(--green) 40%,var(--panel))}100%{background:var(--panel)}}
.flashbad{animation:flb .35s}
@keyframes flb{0%{background:color-mix(in srgb,var(--red) 45%,var(--panel))}100%{background:var(--panel)}}
/* lander */
.cv{display:block;margin-inline:auto;width:100%;max-width:400px;background:var(--space);border:1px solid var(--line);border-radius:8px;touch-action:none}
.ctrl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:.6rem;max-width:400px;margin:.7rem auto 0}
.ctrl button{padding:1.1rem 0;font:400 1.05rem var(--display);text-transform:uppercase;border:2px solid var(--line);border-radius:6px;background:var(--panel2);user-select:none;-webkit-user-select:none}
.ctrl button.brake{border-color:var(--red)}
.ctrl button.dis{opacity:.4}
.ctrl button.on{background:var(--red);color:#fff}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;max-width:400px;margin:0 auto .6rem}
.gauge .lab{font:500 .68rem var(--mono);letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between}
.gauge .trk{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.gauge .trk i{display:block;height:100%;width:0;background:var(--cyan)}
.gauge.h .trk i{background:var(--red)}
/* traje */
.meter{display:flex;gap:1rem;align-items:stretch;justify-content:center}
.mtr{width:46px;height:260px;background:var(--panel2);border:2px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
.mtr .safe{position:absolute;left:0;right:0;bottom:30%;height:40%;background:color-mix(in srgb,var(--green) 28%,transparent);border-block:2px dashed var(--green)}
.mtr .fill{position:absolute;left:0;right:0;bottom:0;height:20%;background:var(--cyan)}
.vent{width:100%;max-width:400px;margin:.8rem auto 0;display:block;padding:1.3rem;font:400 1.3rem var(--display);text-transform:uppercase;border-radius:8px;border:2px solid var(--red);background:var(--panel2);user-select:none;-webkit-user-select:none}
.vent:active{background:var(--red);color:#fff}
/* memo */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:.6rem auto 0}
.mc{perspective:700px;aspect-ratio:3/4;border:0;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.f .in,.mc.m .in{transform:rotateY(180deg)}
.mc .fr,.mc .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font:500 clamp(.62rem,2.6vw,.85rem) var(--body);line-height:1.15}
.mc .bk{background:var(--panel2);border:2px solid var(--line)}
.mc .bk::after{content:"";width:34%;aspect-ratio:1;border-radius:50%;border:3px solid var(--red);box-shadow:inset 0 0 0 5px var(--panel2),inset 0 0 0 8px var(--gold)}
.mc .fr{background:var(--panel);border:2px solid var(--cyan);transform:rotateY(180deg);font-weight:600}
.mc.m .fr{border-color:var(--green);background:color-mix(in srgb,var(--green) 20%,var(--panel))}
/* orden */
.ord{display:grid;gap:.5rem}
.oc{display:flex;align-items:center;gap:.8rem;text-align:left;width:100%;padding:.8rem 1rem;background:var(--panel2);border:1.5px solid var(--line);border-radius:6px}
.oc .y{font:400 1.2rem var(--display);color:var(--gold);min-width:3.3rem;visibility:hidden}
.oc.done{border-color:var(--green);background:color-mix(in srgb,var(--green) 20%,var(--panel2))}
.oc.done .y{visibility:visible}
.oc.shake{animation:sh .3s;border-color:var(--red)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.conf{position:fixed;top:-14px;width:9px;height:14px;z-index:20;pointer-events:none;animation:fall 1.9s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
footer{padding:12px 0 30px;color:var(--muted);font:400 .75rem var(--mono);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --- mejora UI --- */
body{background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--cyan) 16%,transparent),transparent),radial-gradient(700px 380px at -10% 100%,color-mix(in srgb,var(--red) 14%,transparent),transparent),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1.2px 1.2px at 12% 18%,var(--fg),transparent),radial-gradient(1px 1px at 78% 12%,var(--fg),transparent),radial-gradient(1.4px 1.4px at 44% 36%,var(--fg),transparent),radial-gradient(1px 1px at 90% 58%,var(--fg),transparent),radial-gradient(1.2px 1.2px at 24% 72%,var(--fg),transparent),radial-gradient(1px 1px at 62% 86%,var(--fg),transparent),radial-gradient(1px 1px at 6% 46%,var(--fg),transparent),radial-gradient(1.3px 1.3px at 70% 44%,var(--fg),transparent);opacity:.28}
.top{backdrop-filter:blur(8px);background:color-mix(in srgb,var(--panel) 88%,transparent)}
.hero h1{font-size:clamp(2.3rem,9vw,4.6rem)}
.prog{margin-top:1.1rem;max-width:420px}
.prog .tr{height:10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.prog .tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s}
.prog .lb{display:flex;justify-content:space-between;margin-top:.35rem;font:500 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cards{grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.cards{grid-template-columns:repeat(3,1fr);gap:16px}}
.gcard{--ac:var(--red);position:relative;border-radius:14px;border-color:color-mix(in srgb,var(--ac) 45%,var(--line));box-shadow:0 6px 18px -10px var(--ac)}
.gcard:nth-child(2){--ac:var(--gold)}.gcard:nth-child(3){--ac:var(--cyan)}.gcard:nth-child(4){--ac:var(--green)}.gcard:nth-child(5){--ac:var(--gold)}.gcard:nth-child(6){--ac:var(--cyan)}
.gcard:hover,.gcard:active{border-color:var(--ac);transform:translateY(-4px) scale(1.01)}
.gcard .art{background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--ac) 22%,var(--space)),var(--space) 70%);padding:12px 0 4px}
.gcard .art svg{width:100%;max-width:150px;height:84px}
.gcard .num{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#0a0d14;font:400 .8rem/24px var(--display);text-align:center}
.gcard .body{padding:.65rem .8rem .85rem}
.gcard h3{font-size:.95rem;line-height:1.15}
.gcard p{font-size:.8rem;line-height:1.3}
.gcard .best{display:inline-block;align-self:flex-start;margin-top:.55rem;padding:.2rem .55rem;border-radius:99px;border:1px solid var(--ac);color:var(--ac);font-size:.7rem}
.gcard .best.played{background:var(--ac);color:#0a0d14}
.btn{border-radius:10px}
.btn.primary{box-shadow:0 6px 16px -6px var(--red)}
.box{border-radius:14px}

/* --- móvil --- */
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;padding-bottom:env(safe-area-inset-bottom)}
button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#stage{-webkit-user-select:none;user-select:none}
.btn{min-height:44px}
.btn.sm{min-height:40px;padding:.4rem .8rem}
.opt{min-height:50px}
.top .wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.mc .fr{font-size:clamp(.62rem,2.9vw,.9rem);line-height:1.15;padding:3px;hyphens:auto;overflow-wrap:anywhere}
.memo{gap:clamp(5px,1.8vw,8px)}
canvas{max-width:100%;height:auto;touch-action:none}
@media(max-width:400px){
  .top .wrap{gap:.5rem;padding-block:.45rem}
  .brand{font-size:.7rem;letter-spacing:.02em}
  .pts small{display:none}
  .pts b{font-size:1.15rem}
  .top .btn{padding:.35rem .6rem;min-height:36px;font-size:.85rem}
  .hero{padding-block:20px 8px}
  .cards{gap:10px}
  .gcard .body{padding:.55rem .65rem .75rem}
  .intro{padding:1.1rem .8rem}
  .box{padding:.85rem .8rem}
}
@media(max-width:340px){.brand{font-size:.6rem;letter-spacing:0}.top .wrap{gap:.35rem}}
@media(max-height:480px) and (orientation:landscape){.hero{padding-block:10px 4px}.hero h1{font-size:1.8rem}}

/* lander: que todo entre en la pantalla */
.cv{width:auto;max-width:100%;height:calc(100vh - 240px);height:calc(100svh - 240px);min-height:190px;max-height:520px}
.ctrl{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:4;margin-top:.5rem}
.ctrl button{padding:1.15rem 0;touch-action:none;min-height:56px}
.hud{margin-bottom:.4rem}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand">Voskhod <b>×</b> Venera 7</div>
  <div class="sp"></div>
  <div class="pts"><small>PUNTOS</small><b id="total">0</b></div>
  <button class="btn sm" id="bTheme" title="Cambiar tema claro u oscuro">Tema</button>
</div></div>

<main id="hub" class="wrap">
  <section class="hero">
    <p class="kicker">Sala de juegos</p>
    <h1>Misión <i>×</i><br>Voskhod 2 y Venera 7</h1>
    <p>Jugá, sumá puntos y superá a tus compañeros. Tu mejor puntaje de cada juego queda guardado.</p>
    <div class="prog"><div class="tr"><i id="progBar"></i></div><div class="lb"><span id="rank"></span><span id="nextR"></span></div></div>
  </section>
  <div class="cards" id="cards"></div>
</main>

<main id="play" class="wrap" hidden>
  <div class="ptop"><button class="btn sm" id="back">← Menú</button><h2 id="ptitle"></h2><div class="pscore" id="pscore"></div></div>
  <div id="stage"></div>
</main>
<footer>Voskhod 2 · Venera 7</footer>

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var best={};try{best=JSON.parse(localStorage.getItem('vv_best')||'{}')||{}}catch(e){best={}}
function save(){try{localStorage.setItem('vv_best',JSON.stringify(best))}catch(e){}}
function total(){var s=0;for(var k in best)s+=best[k];return s}
var RANKS=[[0,'Aspirante'],[600,'Cadete'],[1800,'Cosmonauta'],[3600,'Comandante'],[5500,'Director de misión']];
function rank(){var t=total(),r=RANKS[0][1];RANKS.forEach(function(x){if(t>=x[0])r=x[1]});return r}
function updatePts(){var t=total();$('#total').textContent=t;$('#rank').textContent='Rango: '+rank();var i=0;RANKS.forEach(function(x,k){if(t>=x[0])i=k});var nx=RANKS[i+1];$('#progBar').style.width=(nx?Math.min(100,(t-RANKS[i][0])/(nx[0]-RANKS[i][0])*100):100)+'%';$('#nextR').textContent=nx?'Faltan '+(nx[0]-t)+' pts':'Rango máximo'}
function submit(id,p){p=Math.max(0,Math.round(p));var nw=p>(best[id]||0);if(nw){best[id]=p;save()}updatePts();renderCards();return nw}
function confetti(){var cols=['#ef4136','#f4b840','#62c7e8','#7bd389','#ece9e1'];for(var i=0;i<46;i++){var d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%5];d.style.animationDelay=(Math.random()*.5)+'s';d.style.animationDuration=(1.4+Math.random()*1.2)+'s';document.body.appendChild(d);(function(x){setTimeout(function(){x.remove()},3200)})(d)}}
$('#bTheme').onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':!matchMedia('(prefers-color-scheme: light)').matches;r.dataset.theme=dark?'light':'dark'};

/* ---------- juegos ---------- */
var stopFn=null,curId=null;
var ICON={
 quiz:'<svg viewBox="0 0 150 96"><circle cx="75" cy="48" r="38" fill="none" stroke="#62c7e8" stroke-width="5"/><text x="75" y="66" text-anchor="middle" font-size="52" font-family="Russo One,Arial" fill="#f4b840">?</text></svg>',
 rapid:'<svg viewBox="0 0 150 96"><rect x="14" y="26" width="52" height="44" rx="6" fill="none" stroke="#ef4136" stroke-width="5"/><rect x="84" y="26" width="52" height="44" rx="6" fill="none" stroke="#f4b840" stroke-width="5"/><path d="M66 48h18" stroke="#ece9e1" stroke-width="4" stroke-dasharray="3 4"/></svg>',
 lander:'<svg viewBox="0 0 150 96"><rect x="0" y="82" width="150" height="14" fill="#7a4a2a"/><rect x="52" y="80" width="46" height="4" fill="#ef4136"/><path d="M52 30Q75-10 98 30" fill="#ef4136"/><path d="M60 30L75 56M75 30V56M90 30L75 56" stroke="#9aa4b8" stroke-width="2" fill="none"/><circle cx="75" cy="62" r="9" fill="#ece9e1"/></svg>',
 suit:'<svg viewBox="0 0 150 96"><ellipse cx="75" cy="56" rx="26" ry="30" fill="#ece9e1"/><circle cx="75" cy="20" r="13" fill="#ece9e1"/><ellipse cx="78" cy="20" rx="8" ry="6" fill="#f4b840"/><rect x="66" y="50" width="18" height="12" rx="3" fill="#ef4136"/><path d="M49 44L28 30M101 44L122 30" stroke="#ece9e1" stroke-width="6" stroke-linecap="round"/></svg>',
 memo:'<svg viewBox="0 0 150 96"><rect x="14" y="14" width="40" height="56" rx="6" fill="#1a2338" stroke="#62c7e8" stroke-width="3"/><rect x="62" y="22" width="40" height="56" rx="6" fill="#1a2338" stroke="#f4b840" stroke-width="3" transform="rotate(8 82 50)"/><circle cx="34" cy="42" r="10" fill="none" stroke="#ef4136" stroke-width="4"/><circle cx="82" cy="50" r="10" fill="none" stroke="#ef4136" stroke-width="4"/></svg>',
 orden:'<svg viewBox="0 0 150 96"><path d="M12 48H138" stroke="#9aa4b8" stroke-width="3" stroke-dasharray="4 6"/><circle cx="24" cy="48" r="9" fill="#62c7e8"/><circle cx="50" cy="48" r="9" fill="#62c7e8"/><circle cx="76" cy="48" r="9" fill="#f4b840"/><circle cx="102" cy="48" r="9" fill="#ef4136"/><circle cx="128" cy="48" r="9" fill="#ef4136"/></svg>'};
var GAMES=[
 {id:'quiz',title:'Quiz relámpago',tag:'10 preguntas, 15 segundos cada una',start:quiz},

/* 1 quiz */
function quiz(st,api){
  var Q=[
   ['¿Qué significa «Voskhod»?',['Amanecer','Águila','Estrella','Viaje'],0],
   ['¿Quiénes viajaron en la Voskhod 2?',['Komarov y Feoktístov','Belyayev y Leónov','Yegórov y Komarov','Solo Leónov'],1],
   ['¿Cuánto duró la caminata espacial de Leónov?',['2 min 9 s','12 min 9 s','53 min','1 hora'],1],
   ['¿Qué le pasó al traje de Leónov en el vacío?',['Se infló','Se congeló','Se apagó','Se rompió la visera'],0],
   ['¿Desde qué cosmódromo despegó Voskhod 2?',['Plesetsk','Cabo Cañaveral','Baikonur','Vostochny'],2],
   ['¿Qué apodo recibió Venus?',['Planeta dorado','Gemelo malvado','Hermano menor','Gigante helado'],1],
   ['¿En qué año aterrizó Venera 7 en Venus?',['1962','1965','1970','1972'],2],
   ['¿Cuántas veces mayor que la terrestre es la presión en la superficie de Venus?',['9 veces','2 veces','900 veces','90 veces'],3],
   ['¿Por qué se creyó que Venera 7 había fracasado?',['Explotó al lanzarse','Parecía no transmitir, pero había señales débiles en las cintas','Nunca llegó a Venus','No tenía baterías'],1],
   ['¿Qué naves reemplazaron a las Voskhod?',['Gemini','Apollo','Soyuz','Vostok'],2]];
  var order,i,score,streak,ok,t0,tm,locked;
  function begin(){order=shuffle(Q);i=0;score=0;streak=0;ok=0;api.score(0);ask()}
  function ask(){
    if(i>=order.length){return result(st,api,score,ok+' de '+order.length+' correctas',ok>=8)}
    locked=false;var q=order[i];var opts=shuffle(q[1].map(function(t,k){return {t:t,c:k===q[2]}}));
    st.innerHTML='<div class="box"><div class="row" style="justify-content:space-between"><span class="stat">Pregunta <b>'+(i+1)+'</b>/'+order.length+'</span><span class="stat">Racha <b id="qs">'+streak+'</b></span></div><div class="bar" style="margin-top:.5rem"><i id="qb"></i></div><div class="big">'+q[0]+'</div><div id="qo"></div></div>';
    opts.forEach(function(o){var b=document.createElement('button');b.className='btn opt';b.textContent=o.t;b.onclick=function(){pick(b,o,opts)};$('#qo',st).appendChild(b)});
    t0=Date.now();clearInterval(tm);tm=setInterval(function(){var left=15-(Date.now()-t0)/1000;var bar=$('#qb',st);if(bar)bar.style.width=Math.max(0,left/15*100)+'%';if(left<=0){clearInterval(tm);timeout(opts)}},100);
  }
  function reveal(opts){$$('.opt',st).forEach(function(b,k){b.disabled=true;if(opts[k].c)b.classList.add('ok')})}
  function next(){setTimeout(function(){i++;ask()},900)}
  function pick(b,o,opts){
    if(locked)return;locked=true;clearInterval(tm);var left=Math.max(0,15-(Date.now()-t0)/1000);reveal(opts);
    if(o.c){ok++;streak++;score+=100+Math.round(left*5)+(streak>1?25*(streak-1):0);b.classList.add('ok')}else{streak=0;b.classList.add('bad')}
    api.score(score);next();
  }
  function timeout(opts){if(locked)return;locked=true;streak=0;reveal(opts);next()}
  intro(st,'Quiz relámpago','10 preguntas. Cuanto más rápido respondas, más puntos. Las rachas suman bonus.',begin);
  return function(){clearInterval(tm)};
}

/* 2 rapido */
function rapid(st,api){
  var V=['Primera caminata espacial','Misión tripulada','Despegó de Baikonur','Pavel Belyayev, comandante','Alekséi Leónov, piloto','Su traje se infló en el vacío','Pasó 12 min 9 s fuera de la nave','Probó que se puede trabajar fuera de una nave'];
  var E=['Sonda robótica','Lanzada el 17 de agosto de 1970','Aterrizó el 15 de diciembre de 1970','Midió 457–474 °C','Presión 90 veces la terrestre','Primera señal desde la superficie de otro planeta','Su paracaídas se rompió','Se creyó un fracaso durante semanas','Cápsula apenas más grande que un balón'];
  var pool,idx,cur,score,streak,left,tm,t0,over;
  function begin(){
    pool=shuffle(V.map(function(t){return [t,0]}).concat(E.map(function(t){return [t,1]})));idx=0;score=0;streak=0;over=false;t0=Date.now();api.score(0);
    st.innerHTML='<div class="box" id="rb"><div class="row" style="justify-content:space-between"><span class="stat">Tiempo <b id="rt">30</b></span><span class="stat">Racha <b id="rs">0</b></span></div><div class="bar" style="margin-top:.5rem"><i id="rbar"></i></div><div class="big" id="rq" style="min-height:3.4em;display:flex;align-items:center;justify-content:center;text-align:center"></div><div class="duel"><button class="a" id="rA">Voskhod 2</button><button class="b" id="rE">Venera 7</button></div><p class="stat" style="text-align:center;margin:.8rem 0 0">También con las flechas ← →</p></div>';
    $('#rA',st).onclick=function(){ans(0)};$('#rE',st).onclick=function(){ans(1)};show();
    clearInterval(tm);tm=setInterval(function(){left=30-(Date.now()-t0)/1000;if(left<=0){finish();return}$('#rt',st).textContent=Math.ceil(left);$('#rbar',st).style.width=(left/30*100)+'%'},100);
  }
  function show(){if(idx>=pool.length){pool=shuffle(pool);idx=0}cur=pool[idx++];$('#rq',st).textContent=cur[0]}
  function ans(v){
    if(over)return;var box=$('#rb',st);box.classList.remove('flash','flashbad');void box.offsetWidth;
    if(v===cur[1]){streak++;score+=10+Math.min(10,streak);box.classList.add('flash')}else{streak=0;score=Math.max(0,score-5);box.classList.add('flashbad')}
    $('#rs',st).textContent=streak;api.score(score);show();
  }
  function key(e){if(over||!$('#rA',st))return;if(e.key==='ArrowLeft')ans(0);if(e.key==='ArrowRight')ans(1)}
  function finish(){over=true;clearInterval(tm);document.removeEventListener('keydown',key);result(st,api,score,'Se acabó el tiempo',score>=250)}
  document.addEventListener('keydown',key);
  intro(st,'¿Voskhod 2 o Venera 7?','Tenés 30 segundos. Aparece una frase y tocás a qué misión pertenece. Acertar suma, errar resta.',begin);
  return function(){clearInterval(tm);document.removeEventListener('keydown',key)};
}

/* 3 aterrizaje */
function lander(st,api){
  var W=360,H=520,raf=0,keys={l:0,r:0,b:0},s,pad,wind,running=false;
  function begin(){
    st.innerHTML='<div class="hud"><div class="gauge"><div class="lab"><span>PARACAÍDAS</span></div><div class="trk"><i id="gF" style="width:100%"></i></div></div><div class="gauge h"><div class="lab"><span>CALOR</span></div><div class="trk"><i id="gH"></i></div></div><div class="gauge"><div class="lab"><span>VELOCIDAD</span></div><div class="mono" id="gV" style="font-size:.95rem">0</div></div></div><canvas class="cv" id="cv" width="'+W*2+'" height="'+H*2+'" aria-label="Aterrizaje"></canvas><div class="ctrl"><button id="kL">◀</button><button id="kB" class="brake">Frenar</button><button id="kR">▶</button></div><p class="stat" style="text-align:center;margin-top:.6rem">Teclado: ← → y barra espaciadora</p>';
    s={x:60+Math.random()*240,y:78,vx:0,vy:0,fuel:100,heat:0,broken:0,fired:false,t:0,ch:0};
    pad={x:70+Math.random()*220,w:96};wind=(Math.random()-.5)*50;keys={l:0,r:0,b:0};running=true;api.score(0);
    bind('#kL','l');bind('#kR','r');bind('#kB','b');
    var last=performance.now();
    function loop(now){if(!running)return;var dt=Math.min(.05,(now-last)/1000);last=now;step(dt);draw();if(running)raf=requestAnimationFrame(loop)}
    raf=requestAnimationFrame(loop);
  }
  function bind(sel,k){var b=$(sel,st);function on(e){e.preventDefault();keys[k]=1;b.classList.add('on')}function off(e){e.preventDefault();keys[k]=0;b.classList.remove('on')}
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);b.addEventListener('contextmenu',function(e){e.preventDefault()})}
  function kd(e){if(!running)return;if(e.key==='ArrowLeft')keys.l=1;else if(e.key==='ArrowRight')keys.r=1;else if(e.key===' '||e.key==='ArrowUp'){keys.b=1;e.preventDefault()}}
  function ku(e){if(e.key==='ArrowLeft')keys.l=0;else if(e.key==='ArrowRight')keys.r=0;else if(e.key===' '||e.key==='ArrowUp')keys.b=0}
  document.addEventListener('keydown',kd);document.addEventListener('keyup',ku);
  function step(dt){
    s.t+=dt;
        if(s.broken>0)s.broken-=dt;
    var ay=45,braking=keys.b&&s.fuel>0&&s.broken<=0;
    s.ch+=((braking?1:0)-s.ch)*Math.min(1,dt*9);
    if(braking){ay-=118*(s.fired?.5:1);s.fuel=Math.max(0,s.fuel-22*dt)}
    wind+=(Math.random()-.5)*40*dt;wind=Math.max(-45,Math.min(45,wind));
    s.vx+=(wind*.6+(keys.r-keys.l)*95)*dt;s.vx*=.995;
    s.vy=Math.max(0,Math.min(210,s.vy+ay*dt));
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.x<14){s.x=14;s.vx=0}if(s.x>W-14){s.x=W-14;s.vx=0}
    s.heat+=dt*(100/22);
    if(s.y>=H-52){s.y=H-52;end()}else if(s.heat>=100){s.heat=100;end(true)}
  }
  function end(hot){
    running=false;cancelAnimationFrame(raf);
    var safe=s.vy<=62&&Math.abs(s.vx)<=38,onPad=Math.abs(s.x-pad.x)<pad.w/2,pts,msg,win=false;
    if(hot){pts=0;msg='Te sobrecalentaste'}
    else if(safe&&onPad){pts=800+s.fuel*4+(100-s.heat)*3;msg='Aterrizaje perfecto';win=true}
    else if(safe){pts=300;msg='Aterrizaste, pero fuera de la zona'}
    else{pts=0;msg='Te estrellaste a '+Math.round(s.vy)+' de velocidad'}
    setTimeout(function(){result(st,api,pts,msg,win)},350);
  }
  function draw(){
    var cv=$('#cv',st);if(!cv)return;var c=cv.getContext('2d');c.setTransform(2,0,0,2,0,0);
    c.fillStyle='#0b1020';c.fillRect(0,0,W,H);
    c.fillStyle='rgba(244,184,64,.33)';[[60,28,110,22],[250,40,120,24],[170,70,90,16]].forEach(function(e){c.beginPath();c.ellipse(e[0],e[1],e[2],e[3],0,0,7);c.fill()});
    c.fillStyle='rgba(239,65,54,'+(s.heat/100*.45)+')';c.fillRect(0,H-220,W,220);
    c.fillStyle='#7a4a2a';c.fillRect(0,H-40,W,40);c.fillStyle='#ef4136';c.fillRect(pad.x-pad.w/2,H-44,pad.w,6);
    c.save();c.translate(s.x,s.y);
    if(s.ch>.04){c.save();c.translate(0,-2);c.rotate(Math.max(-.25,Math.min(.25,s.vx*.004)));c.scale(s.ch,s.ch);
      c.fillStyle=s.fired?'#b23a30':'#ef4136';c.beginPath();c.arc(0,-26,34,Math.PI,s.fired?Math.PI*1.62:0);c.closePath();c.fill();
      if(!s.fired){c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.arc(0,-26,34,Math.PI*1.25,Math.PI*1.6);c.lineTo(0,-26);c.fill()}
      c.strokeStyle='#9aa4b8';c.lineWidth=1.5;c.beginPath();c.moveTo(-34,-26);c.lineTo(0,0);c.moveTo(34,-26);c.lineTo(0,0);c.moveTo(0,-60);c.lineTo(0,0);c.stroke();c.restore()}
    if(s.broken>0){var t=1.4-s.broken;for(var i=0;i<3;i++){c.save();c.globalAlpha=Math.max(0,1-t/1.4);c.translate((i-1)*30+(i-1)*t*45,-34-t*(70+i*25));c.rotate(t*(i+1)*2.2);c.fillStyle='#ef4136';c.beginPath();c.moveTo(-14,8);c.lineTo(0,-12);c.lineTo(16,6);c.closePath();c.fill();c.restore()}}
    c.fillStyle='#ece9e1';c.beginPath();c.arc(0,0,12,0,7);c.fill();c.fillStyle='#f4b840';c.fillRect(-5,9,10,5);
    c.restore();
    if(s.broken>0){c.fillStyle='rgba(239,65,54,.92)';c.fillRect(W/2-120,10,240,28);c.fillStyle='#fff';c.font='700 14px sans-serif';c.textAlign='center';c.fillText('¡SE ROMPIÓ EL PARACAÍDAS!',W/2,29)}
    if(s.fired&&s.broken<=0){c.fillStyle='#ef4136';c.font='700 12px sans-serif';c.textAlign='center';c.fillText('PARACAÍDAS DAÑADO: FRENA LA MITAD',W/2,24)}
    var kb=$('#kB',st);if(kb)kb.classList.toggle('dis',s.broken>0);
    $('#gF',st).style.width=s.fuel+'%';$('#gH',st).style.width=s.heat+'%';
    var v=$('#gV',st);v.textContent=Math.round(s.vy);v.style.color=s.vy<=62?'#7bd389':'#ef4136';
  }
  intro(st,'Aterrizá la sonda','Mantené apretado «Frenar» para abrir el paracaídas, corregí el viento con las flechas y llegá lento a la zona roja antes de que el calor suba al máximo. Ojo con el combustible: si lo gastás todo, no frenás más.',begin);
  return function(){running=false;cancelAnimationFrame(raf);document.removeEventListener('keydown',kd);document.removeEventListener('keyup',ku)};
}

/* 4 traje */
function suit(st,api){
  var DUR=729,RATE=45,p,clock,safeT,g,raf,running=false,nextG;
  function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
  function begin(){
    st.innerHTML='<div class="box"><div class="row" style="justify-content:space-between"><span class="stat">Reloj <b id="sc">0:00</b> / 12:09</span><span class="stat">Zona segura <b id="ss">0%</b></span></div><div class="bar" style="margin-top:.5rem"><i id="sb" style="width:0;background:var(--gold)"></i></div><div class="meter"><svg viewBox="0 0 200 260" width="220" height="260" aria-label="Cosmonauta"><g transform="translate(100,150)"><path id="sl" d="" stroke="#ece9e1" stroke-width="9" stroke-linecap="round" fill="none"/><ellipse id="sb2" rx="30" ry="40" fill="#ece9e1"/><rect x="-12" y="-8" width="24" height="16" rx="4" fill="#ef4136"/><circle id="sh" cy="-60" r="18" fill="#ece9e1"/><ellipse id="sv" cx="5" cy="-60" rx="12" ry="9" fill="#f4b840"/></g></svg><div class="mtr" aria-label="Presión del traje"><div class="safe"></div><div class="fill" id="sf"></div></div></div><button class="vent" id="vb">Ventear</button><p class="stat" style="text-align:center;margin:.6rem 0 0">Mantené la presión en la zona verde. Barra espaciadora también sirve.</p></div>';
    p=40;clock=0;safeT=0;g=0;nextG=1.5;running=true;api.score(0);
    $('#vb',st).addEventListener('pointerdown',function(e){e.preventDefault();vent()});
    var last=performance.now();
    function loop(now){if(!running)return;var dt=Math.min(.05,(now-last)/1000);last=now;step(dt);draw();if(running)raf=requestAnimationFrame(loop)}
    raf=requestAnimationFrame(loop);
  }
  function vent(){if(running)p=Math.max(0,p-13)}
  function kd(e){if(e.key===' '&&running){e.preventDefault();vent()}}
  document.addEventListener('keydown',kd);
  function step(dt){
    clock+=dt*RATE;nextG-=dt;if(nextG<=0){g=8+Math.random()*16;nextG=1.2+Math.random()*2.2}
    g=Math.max(0,g-14*dt);var drift=5+clock/DUR*9;p+=(drift+g)*dt;
    if(p>=30&&p<=70)safeT+=dt*RATE;
    if(p>=100){p=100;draw();finish(false)}else if(clock>=DUR){clock=DUR;finish(true)}
  }
  function draw(){
    if(!$('#sf',st))return;
    $('#sf',st).style.height=Math.min(100,p)+'%';$('#sf',st).style.background=(p<30||p>70)?(p>85?'var(--red)':'var(--gold)'):'var(--green)';
    var rx=22+p*.3,ry=34+p*.22;
    $('#sb2',st).setAttribute('rx',rx);$('#sb2',st).setAttribute('ry',ry);$('#sh',st).setAttribute('cy',-(ry+22));$('#sv',st).setAttribute('cy',-(ry+22));
    $('#sl',st).setAttribute('d','M'+(-rx)+' -12L'+(-rx-30)+' -34M'+rx+' -12L'+(rx+30)+' -34M-14 '+(ry-6)+'L-24 '+(ry+30)+'M14 '+(ry-6)+'L24 '+(ry+30));
    $('#sc',st).textContent=fmt(clock);$('#sb',st).style.width=(clock/DUR*100)+'%';$('#ss',st).textContent=Math.round(safeT/Math.max(1,clock)*100)+'%';
  }
  function finish(win){
    running=false;cancelAnimationFrame(raf);var frac=safeT/DUR;var pts=frac*600+(win?400:0);
    setTimeout(function(){result(st,api,pts,win?'¡Completaste 12:09!':'El traje se infló demasiado (a los '+fmt(clock)+')',win)},300);
  }
  intro(st,'Mantené el traje','La presión del traje sube sola, con ráfagas. Tocá «Ventear» para bajarla y mantenela en la zona verde hasta que el reloj llegue a 12:09. Si llega al tope, perdés.',begin);
  return function(){running=false;cancelAnimationFrame(raf);document.removeEventListener('keydown',kd)};
}

/* 5 memorama */
function memo(st,api){
  var P=[['Leónov','Caminata espacial'],['Belyayev','Comandante'],['12:09','Duración de la caminata'],['Baikonur','Cosmódromo'],['Venera 7','Sonda robótica'],['457–474 °C','Superficie de Venus'],['90×','Presión de Venus'],['Soyuz','Reemplazó a Voskhod']];
  var cards,open,moves,found,t0,tm,lock;
  function begin(){
    cards=[];P.forEach(function(p,i){cards.push({k:i,t:p[0]},{k:i,t:p[1]})});cards=shuffle(cards);open=[];moves=0;found=0;lock=false;t0=Date.now();api.score(0);
    st.innerHTML='<div class="box"><div class="row" style="justify-content:space-between"><span class="stat">Movimientos <b id="mm">0</b></span><span class="stat">Tiempo <b id="mt">0</b> s</span><span class="stat">Parejas <b id="mp">0</b>/8</span></div><div class="memo" id="mg"></div></div>';
    cards.forEach(function(c,i){var b=document.createElement('button');b.className='mc';b.setAttribute('aria-label','Carta '+(i+1));b.innerHTML='<div class="in"><div class="bk"></div><div class="fr">'+c.t+'</div></div>';b.onclick=function(){flip(i,b)};$('#mg',st).appendChild(b)});
    clearInterval(tm);tm=setInterval(function(){var e=$('#mt',st);if(e)e.textContent=Math.floor((Date.now()-t0)/1000)},500);
  }
  function flip(i,b){
    if(lock||b.classList.contains('f')||b.classList.contains('m'))return;
    b.classList.add('f');open.push([i,b]);
    if(open.length===2){
      moves++;$('#mm',st).textContent=moves;lock=true;
      var a=open[0],c=open[1];
      if(cards[a[0]].k===cards[c[0]].k){
        setTimeout(function(){a[1].classList.add('m');c[1].classList.add('m');found++;$('#mp',st).textContent=found;open=[];lock=false;if(found===P.length)done()},450);
      }else{
        setTimeout(function(){a[1].classList.remove('f');c[1].classList.remove('f');open=[];lock=false},850);
      }
    }
  }
  function done(){clearInterval(tm);var secs=Math.floor((Date.now()-t0)/1000);var pts=Math.max(100,1000-(moves-8)*35-secs*5);setTimeout(function(){result(st,api,pts,moves+' movimientos en '+secs+' s',true)},500)}
  intro(st,'Memorama','Dadas vuelta de a dos, encontrá cada término con su pareja. Menos movimientos y menos tiempo, más puntos.',begin);
  return function(){clearInterval(tm)};
}

/* 6 orden */
function orden(st,api){
  var E=[['Mariner 2 pasa a 34.400 km de Venus',1962],['Voskhod 1, la primera nave con tres tripulantes',1964],['Voskhod 2: Leónov camina en el espacio',1965],['Venera 7 transmite desde la superficie de Venus',1970],['Venera 8 aterriza en Venus',1972]];
  var list,next,errors,pts;
  function begin(){
    list=shuffle(E);next=0;errors=0;pts=0;api.score(0);
    var sorted=E.slice().sort(function(a,b){return a[1]-b[1]});
    st.innerHTML='<div class="box"><p class="stat" style="margin:0 0 .8rem">Tocá los hechos del más antiguo al más reciente. Errores: <b id="oe">0</b></p><div class="ord" id="ol"></div></div>';
    list.forEach(function(e){var b=document.createElement('button');b.className='oc';b.innerHTML='<span class="y">'+e[1]+'</span><span>'+e[0]+'</span>';
      b.onclick=function(){
        if(b.classList.contains('done'))return;
        if(e[1]===sorted[next][1]){b.classList.add('done');next++;pts+=200;api.score(Math.max(0,pts));
          if(next===sorted.length){var total=Math.max(0,pts+(errors===0?200:0));setTimeout(function(){result(st,api,total,errors===0?'Sin errores':errors+' errores',errors<=1)},500)}}
        else{errors++;pts-=50;$('#oe',st).textContent=errors;api.score(Math.max(0,pts));b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
      };$('#ol',st).appendChild(b)});
  }
  intro(st,'Ordená la historia','Cinco hechos mezclados. Tocalos en orden cronológico, empezando por el más antiguo.',begin);
  return null;
}

updatePts();renderCards();
})();
</script>
</body>
</html>
